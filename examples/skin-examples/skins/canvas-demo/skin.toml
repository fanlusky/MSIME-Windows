# 水杉输入法 schema_version 2 皮肤样例：在 canvas 全贴图基底上，用九宫格面板图、上下两层挂件和一个循环播放的
# APNG 小动画拼出整个候选框。v1 的键（配色、字体、翻页箭头、工具栏……）在这里照样可用，写法见 niya-demo。
# 所有图片都是程序生成的几何图形，随本目录以 MIT 授权。

schema_version = 2                 # v2 必须以 canvas 为 base；写了 2 而 base 不是 canvas 的皮肤按 1 处理
id = "canvas-demo"
name = "Canvas Demo"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "canvas 全贴图基底样例：夜蓝玻璃九宫格面板、面板后探出的叶子、右上角循环闪烁的 APNG 星光。"
# canvas：透明面板、无描边、无圆角、无阴影，外观全部来自下面的贴图。它只能当 base，不能单独选用。
base = "canvas"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 168
item_corner_radius_dip = 5         # 选中 / 悬停高亮的圆角
# 预编辑行与候选之间的距离，0–100 DIP；只影响这一处，不影响候选与翻页箭头之间。
line_gap_dip = 4

# 九宫格面板图，语义同 CSS border-image（stretch）。
# panel.png 是 64×64 的 2 倍图：切片按源图像素写 20，边框按屏幕 DIP 画 10 宽，所以 200% 缩放下逐像素清晰，
# 100% 下是缩小一半的同一张图。四角的小菱形落在切片之内，不会被拉伸。
[candidate_window.border_image]
source = "assets/panel.png"
slice_dip = [20]                   # 切片线，源图像素，1/2/4 个值（上右下左，同 CSS）
width_dip = [10]                   # 边框绘制宽度，DIP；不写时取切片的数值
fill = true                        # 画九宫格中心块；false 时中心留空

# 内容（预编辑与候选）离面板外缘的距离，DIP；某一边小于边框宽度时按边框宽度算。
[candidate_window.content_insets_dip]
top = 10
right = 12
bottom = 10
left = 12

# 挂件伸到卡片外面时窗口要多留的透明空白，DIP。
[candidate_window.outer_insets_dip]
top = 12
right = 10
bottom = 12
left = 14

# 挂件：z_index < 1 的画在面板之下，其余画在面板与文字之上；同层按 z_index、再按书写顺序叠放。
# 图片在 width_dip × height_dip 的框里等比缩放、居中；anchor 是框贴着面板的哪个位置，offset 正数向右、向下。
[[candidate_window.decorations]]
image = "assets/leaf.png"          # 64×64 的 2 倍图，画成 32×32 DIP
anchor = "bottom-left"
offset_x_dip = -14
offset_y_dip = 12
width_dip = 32
height_dip = 32
z_index = 0                        # 在面板之下：只有伸出面板的那一截看得见

[[candidate_window.decorations]]
image = "assets/sparkle.apng"      # 8 帧、每帧 100 ms、无限循环；系统关闭动画效果时只显示第一帧
anchor = "top-right"
offset_x_dip = 10
offset_y_dip = -12
width_dip = 24
height_dip = 24
z_index = 2

# 面板是深色玻璃，深浅两套主题都用浅色文字。
[candidate.dark]
accent = "#5eead4"
selected = "rgba(94, 234, 212, 0.20)"
hover = "rgba(94, 234, 212, 0.10)"
text = "#e8f1ff"
number = "rgba(232, 241, 255, 0.60)"
preedit_text = "#99f6e4"
selected_text = "#ffffff"
selected_bar = "#fde68a"

[candidate.light]
accent = "#5eead4"
selected = "rgba(94, 234, 212, 0.22)"
hover = "rgba(94, 234, 212, 0.12)"
text = "#f1f5ff"
number = "rgba(241, 245, 255, 0.62)"
translation = "#c4b5fd"            # 浅色主题的默认翻译色偏深，压在深色面板上看不清
preedit_text = "#99f6e4"
selected_text = "#ffffff"
selected_bar = "#fde68a"

[license]
code = "MIT"
assets = "MIT"
source = "Generated geometry by the Metasequoia IME contributors."
